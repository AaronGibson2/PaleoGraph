name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@10.34.6
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://paleograph_test:paleograph_ci@localhost:5432/paleograph_test
      TEST_DATABASE_URL: postgresql+psycopg://paleograph_test:paleograph_ci@localhost:5432/paleograph_test
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: paleograph_test
          POSTGRES_USER: paleograph_test
          POSTGRES_PASSWORD: paleograph_ci
        ports:
          - 5432:5432
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U paleograph_test -d paleograph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
      - run: uv sync --project apps/api --locked
      - run: uv run --project apps/api ruff check apps/api scripts
      - run: uv run --project apps/api ruff format --check apps/api scripts
      - run: uv run --project apps/api mypy --config-file apps/api/pyproject.toml apps/api/app
      - name: Migrate and verify repeatability
        run: |
          uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
          uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
          uv run --project apps/api alembic -c apps/api/alembic.ini downgrade base
          uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
          uv run --project apps/api alembic -c apps/api/alembic.ini check
      - run: uv run --project apps/api python -m app.db
      - run: uv run --project apps/api pytest apps/api/tests

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@10.34.6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @paleograph/web exec playwright install --with-deps chromium
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
      - run: uv sync --project apps/api --locked
      - run: uv run --project apps/api python scripts/test_browser.py
