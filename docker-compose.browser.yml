# A third isolated project: fictional browser fixtures never enter the development database.
services:
  db:
    image: postgis/postgis:17-3.5
    shm_size: 1gb
    environment:
      POSTGRES_DB: paleograph_browser
      POSTGRES_USER: paleograph_browser
      POSTGRES_PASSWORD: paleograph_browser
    ports:
      - "127.0.0.1:56432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paleograph_browser -d paleograph_browser"]
      interval: 2s
      timeout: 5s
      retries: 20
